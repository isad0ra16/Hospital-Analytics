# Project parameters.
# Monetary values are stored as STRINGS on purpose: YAML floats cannot represent
# cents exactly. Code must parse them with decimal.Decimal.

source:
  system: SIH/SUS
  file_type: RD            # AIH Reduzida (approved hospital admission records)
  uf: RJ
  competence: "2024-01"    # processing month; NOT admission or discharge month
  filename: RDRJ2401.dbc
  # Official DATASUS FTP directory. To be re-verified at the start of Phase 2.
  url_dir: ftp://ftp.datasus.gov.br/dissemin/publicos/SIHSUS/200801_/Dados/

  # Archived copy of the exact file used (GitHub Release asset, outside git history).
  archive_release_tag: data-rdrj2401

paths:                     # relative to the project root
  raw: data/raw
  processed: data/processed
  manifest: data/MANIFEST.json

raw_conversion:
  # Code page declared by the DBF header (language driver 0x02 = CP850, decision D-019).
  # CP850 maps every byte to one character: decoding never fails and is reversible.
  encoding: cp850
  # Direct, untreated conversion of the .dbc (same name as in the original project).
  parquet_filename: RDRJ2401.parquet
  money_column: VAL_TOT

# ---------------------------------------------------------------------------
# Historical reference values
# Provenance: recovered from previous ChatGPT conversations; the original code
# and data were lost. These are RECONCILIATION TARGETS, not ground truth:
# results must never be adjusted to match them.
#
# status:
#   recorded            value recorded in the history; criterion believed known
#   needs_verification  value recorded but an inconsistency was found
#   criterion_unknown   value recorded but its calculation criterion is unknown
# ---------------------------------------------------------------------------
