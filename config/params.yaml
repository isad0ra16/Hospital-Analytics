  discharge_year:          # year of DT_SAIDA
    "2023": {value: 29279, status: recorded}
    "2024": {value: 43767, status: recorded}

  repeated_aih_numbers:
    occurrences: {value: 56, status: criterion_unknown,
                  note: "Hypothesis: excess rows (duplicated keep='first'), since 50 repeated numbers need >= 100 rows."}
    distinct_numbers: {value: 50, status: recorded}

  spending_concentration_top10_pct: {value: 58.20, status: criterion_unknown,
                                     note: "Unknown: top-10% cutoff rounding, ties, base (full/IDENT 1), value field."}

  admission_nature_pct:
