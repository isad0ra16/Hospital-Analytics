[project]
name = "hospital-analytics"
version = "0.1.0"
description = "Reproducible analysis of SUS hospital admissions (SIH/SUS RD) for Rio de Janeiro, competence January 2024."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Isadora Veiga" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pyreaddbc>=2.0.4,<3",   # .dbc -> .dbf decompression (DATASUS "blast" format)
    "dbfread>=2.0.7,<3",     # .dbf reader
    "pyyaml>=6.0",
    "matplotlib>=3.9",   # static charts for reports
]

[project.scripts]
hospital-analytics = "hospital_analytics.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_analytics"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Synthetic records are kept one per line (tabular) so columns can be compared at a glance.
"tests/synthetic_data.py" = ["E501"]
"tests/test_reference.py" = ["E501"]
